services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: client_cms
      POSTGRES_USER: client_cms_user
      POSTGRES_PASSWORD: CHANGE_ME
    volumes:
      - client_cms_pgdata:/var/lib/postgresql/data

  payload:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./media:/app/public/media
    depends_on:
      - db

volumes:
  client_cms_pgdata:
