name: Deploy CMS

on:
  push:
    branches: [main]
    tags:
      - "deploy-cms-*"
    paths:
      - "apps/cms/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-cms.yml"
  workflow_dispatch:

concurrency:
  group: cms-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Archive source for VPS build
        run: git archive --format=tar.gz --output=repo.tar.gz HEAD

      - name: Upload source to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "repo.tar.gz"
          target: "/home/teecrownconsult/apps/cms/"

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            APP_ROOT="/home/teecrownconsult/apps/cms"
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            nvm use 24.15.0

            # The extracted repo IS the running app - build and run in place.
            #
            # Extraction root is $HOME, so the repo's own apps/cms path lands at
            # /home/teecrownconsult/apps/cms - the app directory itself, with no
            # extra nesting. shared/ (env + uploads) is untracked and therefore
            # untouched by extraction, so its paths stay exactly as they were.
            #
            # Deliberately NOT wiped between deploys: node_modules and .next are
            # kept, which is what makes in-place running work and rebuilds fast.
            # The archive is overlaid on top.
            #
            # Trade-off: a source file deleted in git lingers. If that matters,
            # remove apps/cms/.next and the stale file by hand.
            tar -xzf "$APP_ROOT/repo.tar.gz" -C "$HOME"
            cd "$APP_ROOT"
            bash scripts/deploy-vps.sh
            rm -f "$APP_ROOT/repo.tar.gz"
