name: Deploy CMS

on:
  push:
    branches: [main]
    tags:
      - "deploy-cms-*"
    paths:
      - "apps/cms/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-cms.yml"
  workflow_dispatch:

concurrency:
  group: cms-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate types and importmap
        working-directory: apps/cms
        run: |
          pnpm run generate:importmap
          pnpm run generate:types

      - name: Build
        working-directory: apps/cms
        run: pnpm run build

      - name: Prepare deploy bundle
        working-directory: apps/cms
        run: |
          mkdir -p deploy-bundle
          cp -RL .next/standalone/. deploy-bundle/
          cp -RL public deploy-bundle/
          mkdir -p deploy-bundle/.next
          cp -RL .next/static deploy-bundle/.next/
          cp package.json deploy-bundle/
          cp ecosystem.config.cjs deploy-bundle/

      - name: Upload to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "apps/cms/deploy-bundle/*"
          target: "/home/teecrownconsult/apps/cms/deploy-staging"
          strip_components: 3

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            APP_ROOT="/home/teecrownconsult/apps/cms"
            CURRENT_DIR="$APP_ROOT/current"
            STAGING_DIR="$APP_ROOT/deploy-staging"
            SHARED_DIR="$APP_ROOT/shared"

            # Replace current with staging
            rm -rf "$CURRENT_DIR.old"
            mv "$CURRENT_DIR" "$CURRENT_DIR.old" 2>/dev/null || true
            mkdir -p "$CURRENT_DIR"
            cp -R "$STAGING_DIR/." "$CURRENT_DIR/"
            cp "$SHARED_DIR/.env.production" "$CURRENT_DIR/" 2>/dev/null || true

            # Symlink media
            rm -rf "$CURRENT_DIR/media"
            ln -s "$SHARED_DIR/media" "$CURRENT_DIR/media"

            # Restart PM2 — delete first to avoid stale cached state
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            nvm use 24.15.0
            pm2 delete teecrownconsult-cms 2>/dev/null || true
            pm2 start "$CURRENT_DIR/ecosystem.config.cjs"
            pm2 save

            # Cleanup
            rm -rf "$STAGING_DIR"
            rm -rf "$CURRENT_DIR.old"
