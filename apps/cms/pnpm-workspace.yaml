# Read only by the VPS deploy, which installs with --ignore-workspace
# (see scripts/deploy-vps.sh) and therefore never sees the root
# pnpm-workspace.yaml where these approvals normally live.
#
# Without this, pnpm 10 aborts the install with
#   [ERR_PNPM_IGNORED_BUILDS] Ignored build scripts: esbuild, sharp, unrs-resolver
#
# Note: package.json "pnpm.onlyBuiltDependencies" is the pnpm 9 location and is
# NOT honoured by pnpm 10 — it has to be here.
onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver
